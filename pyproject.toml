[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judgeai"
version = "0.3.0"
description = "JudgeAI chat assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "pgvector>=0.3.0",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "fastembed>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
