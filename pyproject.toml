[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judgeai"
version = "0.4.0"
description = "JudgeAI chat assistant"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "pgvector>=0.3.0",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "fastembed>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the working tree, not the copy installed into site-packages by `pip install .`.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The repo has an `alembic/` migrations folder; without this ruff treats the alembic package as local.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `File(...)` / `Form(...)` defaults are the documented pattern.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

# SQLAlchemy async uses greenlets: measure resumed code as well as worker threads.
# https://coverage.readthedocs.io/en/latest/config.html#run-concurrency
[tool.coverage.run]
source = ["src"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 80
show_missing = true
