# AI review of every merge request (reviewer: judgeai/ai-review, settings: .ai-review.yml).
# Shadow mode (allow_failure: true) until OPENAI_API_KEY or ANTHROPIC_API_KEY and
# AI_REVIEW_GITLAB_TOKEN are set as masked CI variables and the first runs are checked;
# then switch to false so an open finding blocks the merge.
include:
  - project: judgeai/ai-review
    ref: main
    file: templates/ai-review.yml
    inputs:
      allow_failure: true

# test -> build -> deploy on the default branch; MRs run tests only.
# Deploy expects SSH_PRIVATE_KEY (File), SSH_KNOWN_HOSTS (File), DEPLOY_HOST,
# DEPLOY_USER in CI/CD variables; see docs/DEPLOY.md.
stages: [test, build, deploy]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

inventory:
  stage: test
  image: python:3.12-slim-bookworm
  timeout: 5m
  interruptible: true
  allow_failure: false
  script:
    - python -m unittest discover -s tests_unit -v
    - python tools/dependency_inventory.py --check

api-tests:
  stage: test
  image: python:3.12-slim-bookworm
  timeout: 15m
  allow_failure: false
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    POSTGRES_USER: judgeai
    POSTGRES_PASSWORD: ephemeral-ci-only
    POSTGRES_DB: judgeai_test
    POSTGRES_HOST: postgres
    LLM_PROVIDER: fake
    DB_NULL_POOL: 'true'
  script:
    - pip install '.[dev]' ./packages/legal_core
    - pytest tests tests_uploads tests_uploads_http tests_pdf tests_reading --cov=src
    - cd packages/legal_core && pytest && cd ../..
    - ruff check src tests packages/legal_core tests_browser tests_uploads tests_uploads_http tests_pdf tests_reading
    - ruff format --check src tests packages/legal_core tests_browser tests_uploads tests_uploads_http tests_pdf tests_reading

browser-auth:
  stage: test
  image: node:22-bookworm
  timeout: 20m
  allow_failure: false
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    POSTGRES_USER: judgeai
    POSTGRES_PASSWORD: ephemeral-ci-only
    POSTGRES_DB: judgeai_browser_test
    POSTGRES_HOST: postgres
    LLM_PROVIDER: fake
    DB_NULL_POOL: 'true'
    AUTH_COOKIE_SECURE: 'false'
    UPLOAD_DIR: /tmp/judgeai-browser-uploads
    CORS_ORIGINS: http://127.0.0.1:5179
  script:
    - apt-get update -qq && apt-get install -y -qq python3-venv
    - python3 -m venv /tmp/acceptance-python
    - . /tmp/acceptance-python/bin/activate
    - pip install '.[dev]' ./packages/legal_core 'playwright==1.64.1'
    - playwright install --with-deps chromium
    - cd verdikt-web && npm ci && npm test && npm run build && cd ..
    - python tests_browser/auth_smoke.py
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - acceptance-screenshots/*.png

# ---- build images (default branch only) ----
build-api:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  timeout: 30m
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/api:latest"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/api/cache"

build-web:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  timeout: 20m
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/verdikt-web"
      --dockerfile "${CI_PROJECT_DIR}/verdikt-web/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/web:latest"
      --cache=true
      --cache-repo "${CI_REGISTRY_IMAGE}/web/cache"

# ---- deploy to production over SSH (default branch only) ----
deploy:
  stage: deploy
  image: alpine:3.20
  timeout: 15m
  resource_group: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production
    url: https://esudya.ru
  variables:
    DEPLOY_DIR: /opt/judgeai
  script:
    - apk add --no-cache openssh-client curl
    - eval "$(ssh-agent -s)"
    - chmod 600 "${SSH_PRIVATE_KEY}"
    - ssh-add "${SSH_PRIVATE_KEY}"
    - mkdir -p "${HOME}/.ssh" && chmod 700 "${HOME}/.ssh"
    - cp "${SSH_KNOWN_HOSTS}" "${HOME}/.ssh/known_hosts"
    - chmod 600 "${HOME}/.ssh/known_hosts"
    - printf 'API_IMAGE=%s/api:%s\nWEB_IMAGE=%s/web:%s\n' "${CI_REGISTRY_IMAGE}" "${CI_COMMIT_SHORT_SHA}" "${CI_REGISTRY_IMAGE}" "${CI_COMMIT_SHORT_SHA}" > deploy.env
    - scp -q deploy/docker-compose.prod.yml deploy/Caddyfile deploy.env "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/"
    - ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_DIR} && docker compose --env-file deploy.env -f docker-compose.prod.yml pull --quiet && docker compose --env-file deploy.env -f docker-compose.prod.yml up -d --remove-orphans"
    - |
      i=0
      until curl -fsS "https://esudya.ru/health" >/dev/null 2>&1; do
        i=$((i+1))
        if [ "$i" -ge 60 ]; then echo "Health check failed after 10 minutes"; exit 1; fi
        sleep 10
      done
      echo "Health check passed: https://esudya.ru/health"
