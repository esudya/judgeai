# Source inventory checks only; API and database verification remain separate.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

inventory:
  stage: test
  image: python:3.12-slim-bookworm
  timeout: 5m
  interruptible: true
  allow_failure: false
  script:
    - python -m unittest discover -s tests_unit -v
    - python tools/dependency_inventory.py --check
